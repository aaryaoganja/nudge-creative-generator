name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Never contacted — `prisma generate` and `next build` only need the URL
      # to parse, and no route touches the database at build time.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
      # CI runs the unit tests, not the browser smoke test, so skip the ~150MB
      # Chromium download that Playwright's postinstall would otherwise do.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      # Fixture-backed: the scrape and provider tests never touch the network,
      # so CI stays deterministic and works without any API key.
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Proves the image Railway will build actually builds, before it fails on Railway.
      - run: docker build -t nudge-creative-generator:ci .
